name: Generate Git City 3D Profile

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-git-city-profile
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      
      - name: Configure npm for git dependencies
        run: |
          npm config set allow-git true
          npm config set scripts-prepend-node-path true
      
      - name: Clone Git City
        run: |
          git clone https://github.com/srizzon/git-city.git git-city-temp
          cd git-city-temp
          npm install --allow-git --allow-scripts --legacy-peer-deps
      
      - name: Generate Git City 3D visualization
        run: |
          cd git-city-temp
          npm run build || true
          mkdir -p ../git-city-dist
          cp -r dist/* ../git-city-dist/ 2>/dev/null || true
          cp -r public/* ../git-city-dist/ 2>/dev/null || true
      
      - name: Update README with Git City link
        run: |
          mkdir -p git-city
          
          if [ -d "git-city-dist" ]; then
            cp -r git-city-dist/* git-city/ 2>/dev/null || true
          fi
          
          if ! grep -q "git-city" README.md; then
            cat >> README.md << 'EOF'

## 🌃 Visualização 3D Interativa (Git City)

Explore seu perfil GitHub como uma **cidade 3D em pixel art**! Cada repositório é um prédio, e a altura representa a atividade de commits.

🔗 **[Clique aqui para ver sua Git City](https://srizzon.github.io/git-city/#/user/KeinanSZ)**

Ou acesse: `https://srizzon.github.io/git-city/#/user/KeinanSZ`
EOF
          fi
      
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "chore: update git-city 3d visualization" || exit 0
          git push
